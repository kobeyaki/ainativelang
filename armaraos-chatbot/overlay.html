<!DOCTYPE html>
<!--
  OBS Browser Source Overlay
  Add this as a Browser Source in OBS: local file or serve via http-server
  Recommended size: 800x200, position bottom-left or bottom of screen
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="2"> <!-- auto-refresh every 2s -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    font-family: 'Segoe UI', monospace;
    padding: 12px 16px;
  }

  #container {
    background: rgba(0, 0, 0, 0.75);
    border-left: 4px solid #00ff88;
    border-radius: 6px;
    padding: 10px 16px;
    max-width: 760px;
    display: none;
  }

  #container.visible { display: block; }

  #header {
    font-size: 11px;
    color: #00ff88;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 4px;
  }

  #status-badge {
    display: inline-block;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 3px;
    margin-left: 8px;
    font-weight: bold;
    text-transform: uppercase;
  }

  .badge-executing { background: #f59e0b; color: #000; }
  .badge-replied   { background: #00ff88; color: #000; }
  .badge-blocked   { background: #ef4444; color: #fff; }
  .badge-error     { background: #ef4444; color: #fff; }
  .badge-busy      { background: #6366f1; color: #fff; }
  .badge-cooldown  { background: #64748b; color: #fff; }

  #user {
    font-size: 13px;
    color: #fff;
    font-weight: bold;
    margin-top: 4px;
  }

  #prompt-line {
    font-size: 12px;
    color: #94a3b8;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #reply-line {
    font-size: 12px;
    color: #e2e8f0;
    margin-top: 4px;
    border-top: 1px solid rgba(255,255,255,0.1);
    padding-top: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #footer {
    font-size: 10px;
    color: #475569;
    margin-top: 6px;
  }
</style>
</head>
<body>
<div id="container">
  <div id="header">
    ⚡ ArmaraOS Live
    <span id="status-badge"></span>
  </div>
  <div id="user"></div>
  <div id="prompt-line"></div>
  <div id="reply-line"></div>
  <div id="footer">Type "probe bot &lt;prompt&gt;" in pump.fun chat to control ArmaraOS</div>
</div>

<script>
  // Reads overlay.json written by bot.js
  // In OBS, set browser source to this file path
  async function refresh() {
    try {
      const res = await fetch('overlay.json?t=' + Date.now());
      if (!res.ok) return;
      const d = await res.json();

      const container = document.getElementById('container');
      const badge = document.getElementById('status-badge');
      const user = document.getElementById('user');
      const promptLine = document.getElementById('prompt-line');
      const replyLine = document.getElementById('reply-line');

      // Hide if stale (older than 30s) or disconnected
      const age = (Date.now() - d.ts) / 1000;
      if (age > 30 || d.status === 'starting' || d.status === 'disconnected') {
        container.classList.remove('visible');
        return;
      }

      container.classList.add('visible');

      badge.className = 'status-badge badge-' + d.status;
      badge.textContent = d.status;

      user.textContent = d.user ? `@${d.user}` : '';

      if (d.status === 'executing') {
        promptLine.textContent = `▶ ${d.prompt || ''}`;
        replyLine.textContent = '…thinking';
      } else if (d.status === 'replied') {
        promptLine.textContent = `▶ ${d.prompt || ''}`;
        replyLine.textContent = d.reply || '';
      } else if (d.status === 'blocked') {
        promptLine.textContent = '🚫 Command blocked';
        replyLine.textContent = d.reason || '';
      } else if (d.status === 'cooldown') {
        promptLine.textContent = `⏳ Wait ${d.wait}s before next command`;
        replyLine.textContent = '';
      } else if (d.status === 'error') {
        promptLine.textContent = '⚠ ArmaraOS error';
        replyLine.textContent = d.error || '';
      } else if (d.status === 'busy') {
        promptLine.textContent = '⏳ Queue full — try again in a moment';
        replyLine.textContent = '';
      }
    } catch (_) {}
  }

  setInterval(refresh, 2000);
  refresh();
</script>
</body>
</html>
