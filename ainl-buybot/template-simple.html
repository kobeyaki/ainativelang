<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 480px; height: 480px;
    background: #000;
    overflow: hidden;
  }
  .container {
    width: 480px; height: 480px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, #0a0a1a 0%, #000 100%);
  }
  .grid {
    position: absolute; inset: 0;
    background-image: 
      linear-gradient(rgba(0,200,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,200,255,0.04) 1px, transparent 1px);
    background-size: 30px 30px;
  }
  .scanlines {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.12) 2px, rgba(0,0,0,0.12) 4px);
    pointer-events: none; z-index: 10;
  }

  /* MASCOT — slams in from top */
  .mascot-wrap {
    position: relative;
    z-index: 5;
    animation: slam 0.4s cubic-bezier(0.22, 1, 0.36, 1) 0.3s both;
  }
  @keyframes slam {
    0%   { transform: translateY(-400px) scale(1.5) rotate(-10deg); opacity: 0; }
    70%  { transform: translateY(20px) scale(0.92) rotate(2deg); opacity: 1; }
    85%  { transform: translateY(-8px) scale(1.03) rotate(-1deg); }
    100% { transform: translateY(0px) scale(1) rotate(0deg); opacity: 1; }
  }

  .mascot {
    width: 200px; height: 200px;
    filter: drop-shadow(0 0 30px rgba(255,150,0,0.9));
    animation: bounce 0.7s ease-in-out 0.9s infinite alternate;
  }
  @keyframes bounce {
    from { transform: translateY(0px); filter: drop-shadow(0 0 30px rgba(255,150,0,0.9)); }
    to   { transform: translateY(-14px); filter: drop-shadow(0 0 50px rgba(255,200,0,1)); }
  }

  /* Shockwave ring on slam */
  .shockwave {
    position: absolute;
    bottom: -5px; left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-radius: 50%;
    border: 3px solid rgba(255,150,0,0.9);
    animation: shockwave 0.5s ease-out 0.65s both;
  }
  @keyframes shockwave {
    0%   { width: 20px; height: 20px; opacity: 1; margin-left: -10px; margin-bottom: -10px; }
    100% { width: 260px; height: 60px; opacity: 0; margin-left: -130px; margin-bottom: -30px; }
  }

  /* Second shockwave */
  .shockwave2 {
    position: absolute;
    bottom: -5px; left: 50%;
    transform: translateX(-50%);
    border-radius: 50%;
    border: 2px solid rgba(0,200,255,0.6);
    animation: shockwave2 0.6s ease-out 0.75s both;
  }
  @keyframes shockwave2 {
    0%   { width: 10px; height: 10px; opacity: 0.8; margin-left: -5px; margin-bottom: -5px; }
    100% { width: 340px; height: 80px; opacity: 0; margin-left: -170px; margin-bottom: -40px; }
  }

  /* NEW BUY text */
  .new-buy {
    font-family: 'Courier New', monospace;
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 6px;
    color: #00ff88;
    text-shadow: 0 0 30px rgba(0,255,136,1), 0 0 60px rgba(0,255,136,0.5);
    margin-top: 20px;
    z-index: 5;
    animation: textSlam 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.85s both, textGlow 0.8s 1.3s infinite alternate;
  }
  @keyframes textSlam {
    0%   { transform: scale(3) translateY(20px); opacity: 0; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }
  @keyframes textGlow {
    from { text-shadow: 0 0 20px rgba(0,255,136,0.8); color: #00ff88; }
    to   { text-shadow: 0 0 50px rgba(0,255,136,1), 0 0 100px rgba(0,255,136,0.4); color: #88ffcc; }
  }

  /* $AINL tag */
  .ainl-tag {
    font-family: 'Courier New', monospace;
    font-size: 16px;
    letter-spacing: 6px;
    color: rgba(255,255,255,0.3);
    margin-top: 10px;
    z-index: 5;
    animation: fadeIn 0.4s ease-out 1.2s both;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Flash on slam */
  .flash {
    position: absolute; inset: 0;
    background: white;
    z-index: 20;
    animation: flash 0.15s ease-out 0.65s both;
  }
  @keyframes flash {
    0%   { opacity: 0.6; }
    100% { opacity: 0; }
  }

  /* Emoji rain */
  .emoji { position: absolute; font-size: 22px; animation: fall linear infinite; opacity: 0; z-index: 3; }
  @keyframes fall {
    0%   { transform: translateY(-30px) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.8; }
    90%  { opacity: 0.6; }
    100% { transform: translateY(520px) rotate(360deg); opacity: 0; }
  }

  /* $AINL bottom brand */
  .brand {
    position: absolute;
    bottom: 14px;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 4px;
    color: rgba(255,255,255,0.15);
    z-index: 5;
    animation: fadeIn 0.4s ease-out 1.4s both;
  }
</style>
</head>
<body>
<div class="container">
  <div class="grid"></div>
  <div class="scanlines"></div>
  <div class="flash"></div>

  <div class="emoji" style="left:6%;animation-duration:3.2s;animation-delay:1.0s">💸</div>
  <div class="emoji" style="left:18%;animation-duration:2.8s;animation-delay:1.5s">🚀</div>
  <div class="emoji" style="left:72%;animation-duration:3.5s;animation-delay:1.1s">💸</div>
  <div class="emoji" style="left:85%;animation-duration:2.5s;animation-delay:1.7s">🌟</div>
  <div class="emoji" style="left:45%;animation-duration:4s;animation-delay:1.3s">💵</div>
  <div class="emoji" style="left:58%;animation-duration:3s;animation-delay:2.0s">🚀</div>

  <div class="mascot-wrap">
    <img class="mascot" src="{{MASCOT_URL}}" />
    <div class="shockwave"></div>
    <div class="shockwave2"></div>
  </div>

  <div class="new-buy">NEW BUY</div>
  <div class="ainl-tag">$AINL</div>
  <div class="brand">AI NATIVE LANGUAGE</div>
</div>
</body>
</html>
